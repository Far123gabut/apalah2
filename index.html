<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contoh Sederhana</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 50px;
      background-color: #f4f4f9;
    }

    h1 {
      color: #333;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #45a049;
    }

    p {
      margin-top: 20px;
      font-size: 18px;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>Halo Dunia 👋</h1>
  <button onclick="ubahTeks()">Klik Saya</button>
  <p id="pesan">Teks ini akan berubah setelah tombol diklik.</p>

  <script>
    function ubahTeks() {
      document.getElementById("pesan").innerText = "Tombol sudah diklik! 🎉";
    }
  </script>
</body>
</html>
